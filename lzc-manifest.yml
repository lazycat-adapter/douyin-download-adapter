usage: |
  首次访问应用控制台时按页面提示完成管理员初始化；
  数据持久保存在 /lzcapp/var/douyin；
  升级时请保留安装参数中的主密钥、PostgreSQL 密码和 Redis 密码。
application:
  subdomain: dydownload
  background_task: true
  multi_instance: false
  public_path:
    - /api
  routes:
    - /=http://douyin:8000
services:
  douyin:
    # upstream: docker.io/evil0ctal/douyin_tiktok_download_api:5.1.13@sha256:5891f816e6cf7814d9ca5c31b277a06988907a9b4ebc1ede62a7a65b3b046dc4
    image: registry.lazycat.cloud/peter/evil0ctal/douyin_tiktok_download_api:b7473a0bc54ab796
    command: [api]
    environment:
      - DTK_SECRET_KEY={{ .U.secret_key }}
      - DTK_DATABASE_URL=postgresql+asyncpg://dtk:{{ .U.postgres_password }}@postgres:5432/dtk
      - DTK_REDIS_URL=redis://:{{ .U.redis_password }}@redis:6379/0
      - DTK_BIND_HOST=0.0.0.0
      - DTK_BIND_PORT=8000
      - DTK_CONSOLE_DIR=/app/web/dist
      - DTK_BACKUP_DIR=/var/lib/dtk/backups
      - DTK_MEDIA_DIR=/var/lib/dtk/media
    binds:
      - /lzcapp/var/douyin/backups:/var/lib/dtk/backups
      - /lzcapp/var/douyin/media:/var/lib/dtk/media
    depends_on:
      - postgres
      - redis
      - migrate
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
  worker:
    # upstream: docker.io/evil0ctal/douyin_tiktok_download_api:5.1.13@sha256:5891f816e6cf7814d9ca5c31b277a06988907a9b4ebc1ede62a7a65b3b046dc4
    image: registry.lazycat.cloud/peter/evil0ctal/douyin_tiktok_download_api:b7473a0bc54ab796
    command: [worker]
    environment:
      - DTK_SECRET_KEY={{ .U.secret_key }}
      - DTK_DATABASE_URL=postgresql+asyncpg://dtk:{{ .U.postgres_password }}@postgres:5432/dtk
      - DTK_REDIS_URL=redis://:{{ .U.redis_password }}@redis:6379/0
      - DTK_MEDIA_DIR=/var/lib/dtk/media
    binds:
      - /lzcapp/var/douyin/media:/var/lib/dtk/media
    depends_on:
      - postgres
      - redis
      - migrate
  migrate:
    # upstream: docker.io/evil0ctal/douyin_tiktok_download_api:5.1.13@sha256:5891f816e6cf7814d9ca5c31b277a06988907a9b4ebc1ede62a7a65b3b046dc4
    image: registry.lazycat.cloud/peter/evil0ctal/douyin_tiktok_download_api:b7473a0bc54ab796
    command: [migrate]
    environment:
      - DTK_SECRET_KEY={{ .U.secret_key }}
      - DTK_DATABASE_URL=postgresql+asyncpg://dtk:{{ .U.postgres_password }}@postgres:5432/dtk
      - DTK_REDIS_URL=redis://:{{ .U.redis_password }}@redis:6379/0
    depends_on:
      - postgres
  postgres:
    # upstream: docker.io/timescale/timescaledb-ha:pg17@sha256:379a3bda9c52887b70c2f5d189cb39598d2bdfd855c23dd51ce76615d4f3899a
    image: registry.lazycat.cloud/peter/timescale/timescaledb-ha:9967e5c4b821813f
    environment:
      - POSTGRES_DB=dtk
      - POSTGRES_USER=dtk
      - POSTGRES_PASSWORD={{ .U.postgres_password }}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    binds:
      - /lzcapp/var/douyin/postgres:/home/postgres/pgdata/data
  redis:
    # upstream: docker.io/library/redis:8-alpine@sha256:bf33e63600ae8240c9f8b553c8fae427550dae17042bc24b06bbe06d3057c9bc
    image: registry.lazycat.cloud/peter/library/redis:e9288a1a402d65aa
    command: [redis-server, --appendonly, 'yes', --requirepass, '{{ .U.redis_password }}']
    binds:
      - /lzcapp/var/douyin/redis:/data

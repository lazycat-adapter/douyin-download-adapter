version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.download.douyin.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/Evil0ctal/Douyin_TikTok_Download_API.git
  select:
    strategy: release
    channel: stable
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
changelog:
  mode: github-release
  git_url: https://github.com/Evil0ctal/Douyin_TikTok_Download_API.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: true
  prepare:
    mode: images
images:
  - id: douyin
    target: service
    service: douyin
    source: docker.io/evil0ctal/douyin_tiktok_download_api:{source_version}
    delivery:
      mode: lazycat
      copy_timeout: 45m
      copy_idle_timeout: 15m
  - id: worker
    target: service
    service: worker
    source: docker.io/evil0ctal/douyin_tiktok_download_api:{source_version}
    delivery:
      mode: lazycat
      copy_timeout: 45m
      copy_idle_timeout: 15m
  - id: migrate
    target: service
    service: migrate
    source: docker.io/evil0ctal/douyin_tiktok_download_api:{source_version}
    delivery:
      mode: lazycat
      copy_timeout: 45m
      copy_idle_timeout: 15m
  - id: postgres
    target: service
    service: postgres
    source: docker.io/timescale/timescaledb-ha:pg17
    delivery:
      mode: lazycat
      copy_timeout: 45m
      copy_idle_timeout: 15m
  - id: redis
    target: service
    service: redis
    source: docker.io/library/redis:8-alpine
    delivery:
      mode: lazycat
      copy_timeout: 30m
      copy_idle_timeout: 10m
stores:
  official:
    enabled: true
    create_if_missing: false
    skip_if_version_exists: true
    continue_if_newer_version: true
